<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chez Paul</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="room">
      <header class="masthead">
        <p class="masthead__eyebrow">Maison d'échecs</p>
        <h1 class="masthead__mark"><em>Chez</em> Paul</h1>
      </header>

      <main class="parlor">
        <section class="table" aria-label="Chessboard">
          <div class="table__mat">
            <div class="board-frame">
              <div class="ranks" aria-hidden="true">
                <span>8</span><span>7</span><span>6</span><span>5</span
                ><span>4</span><span>3</span><span>2</span><span>1</span>
              </div>
              <div class="board" id="board"></div>
              <div class="files" aria-hidden="true">
                <span>a</span><span>b</span><span>c</span><span>d</span
                ><span>e</span><span>f</span><span>g</span><span>h</span>
              </div>
            </div>
          </div>
        </section>

        <aside class="card">
          <div class="card__head">
            <h2 class="card__title">Table for two</h2>
            <p class="card__sub">You vs. Chez</p>
          </div>

          <div class="clock">
            <div class="clock__cell">
              <span class="clock__key">Move</span>
              <span class="clock__val" id="move-number">1</span>
            </div>
            <div class="clock__divider" aria-hidden="true"></div>
            <div class="clock__cell">
              <span class="clock__key">To move</span>
              <span class="clock__val" id="turn">White</span>
            </div>
          </div>

          <div class="status" id="status">Setting the table...</div>

          <div class="controls">
            <label class="field">
              <span class="field__label">Time / move</span>
              <select id="movetime">
                <option value="500">0.5s</option>
                <option value="1000">1s</option>
                <option value="2000" selected>2s</option>
                <option value="3000">3s</option>
                <option value="5000">5s</option>
              </select>
            </label>
            <label class="field" id="threads-row" style="display: none">
              <span class="field__label">Threads</span>
              <select id="threads"></select>
            </label>
            <label class="field">
              <span class="field__label">Play as</span>
              <select id="player-color">
                <option value="white" selected>White</option>
                <option value="black">Black</option>
              </select>
            </label>
            <div class="buttons">
              <button id="unmake-move" class="btn btn--ghost inactive">
                Take back
              </button>
              <button id="new-game" class="btn btn--primary active">
                New game
              </button>
            </div>
          </div>

          <section class="scoresheet">
            <div id="history" class="scoresheet__list"></div>
          </section>
        </aside>
      </main>
    </div>

    <div class="modal" id="promotion-modal">
      <div class="modal-content">
        <h3>Promote to</h3>
        <div class="promotion-choices">
          <button class="promo-btn" data-piece="4">&#9813;</button>
          <button class="promo-btn" data-piece="3">&#9814;</button>
          <button class="promo-btn" data-piece="2">&#9815;</button>
          <button class="promo-btn" data-piece="1">&#9816;</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
